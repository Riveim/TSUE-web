<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>TSUE</title>
</head>
<body>
    <header>
    </header>
    <main>
        <section class="content">
            <h1>Welcome to TSUE</h1>
            <div class="web-navigation">
                <a href="#" data-endpoint="homework">Домашняя работа</a>
                <a href="#" data-endpoint="presentations">Презентации</a>
                <a href="#" data-endpoint="notes">Конспекты</a>
                <a href="#" data-endpoint="subjects">Предметы</a>
                <a href="#" data-endpoint="schedule">Расписание</a>
                <nav>
                    <div class="folder-menu" id="folder-menu">
                        <i class="folder fa-solid fa-folder" id="folder-icon"></i>
                        <i class="folder-open fa-solid fa-folder-open" id="folder-open-icon"></i>

                        <ul class="nav-links">
                            <li><a href="#">About us</a></li>
                            <li><a href="#">Contacts</a></li>
                            <li><a href="#">Other works</a></li>
                        </ul>
                    </div>
                </nav>
            </div>

            <div>
                <button class="open-button" command="show-modal" commandfor="addObj"><i class="fa fa-plus"></i></button>
                <dialog id="addObj">
                    <p>there should be something</p>
                    <button command="close" commandfor="addObj">Close</button>
                </dialog>
            </div>

            <!-- сюда будут подгружаться данные с бэкенда -->
            <div class="data-panel" id="data-panel"></div>

            <!-- отдельная панель для расписания (реальный EduPage-парсер) -->
            <div class="schedule-panel" id="schedule-panel" style="display: none;">
                <div class="schedule-header">
                    <span class="panel-title">Расписание</span>
                    <select id="class-select" class="class-select">
                        <option value="">Выберите группу...</option>
                    </select>
                </div>
                <div id="schedule-content"></div>
            </div>

            <!-- форма для загрузки файла в текущий выбранный раздел -->
            <form class="upload-form" id="upload-form" style="display: none;">
                <input type="text" id="upload-title" placeholder="Название" required>
                <input type="text" id="upload-description" placeholder="Описание (необязательно)">
                <input type="file" id="upload-file" required>
                <button type="submit">Загрузить</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
