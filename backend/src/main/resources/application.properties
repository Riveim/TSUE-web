spring.application.name=backend
server.port=8080

# чтобы обращения к несуществующим путям попадали в GlobalExceptionHandler,
# а не в стандартный whitelabel-error Spring
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# H2 in-memory database — данные живут, пока приложение запущено
spring.datasource.url=jdbc:h2:mem:tsuedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# консоль H2 доступна на http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Загрузка файлов ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# папка на диске, куда сохраняются загруженные файлы
file.upload-dir=uploads

# --- Расписание EduPage ---
